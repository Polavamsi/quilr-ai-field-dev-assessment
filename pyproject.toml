[project]
name = "quilr-ai-field-dev-assessment"
version = "0.1.0"
description = "MCP server, MCP security gateway, streaming PII guardrail, and LLM fallback router"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "regex>=2026.9.29",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
